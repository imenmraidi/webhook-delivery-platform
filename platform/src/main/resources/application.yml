spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/webhooks
    username: webhooks
    password: webhooks
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: delivery-workers
      auto-offset-reset: earliest
      listener:
        concurrency: 3
